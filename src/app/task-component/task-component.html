
@if (this.isAddingTask) {
      <app-new-task (cancelAddingTask)="onCancelAddingTask()"></app-new-task>
    }
<section id="task">
  <header>
    <h2>{{ name }} ' tasks</h2>
    <menu>
      <button (click)="onAddTask()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for (task of selectedUserTasks; track task.id) {
      <li>
        <app-single-task [task]="task" (complete)="completeTask($event)"  />
      </li>
    }
  </ul>
</section>
