<app-header-component></app-header-component>
<main>
  <ul id="users">
    <!---- @for (user of users;track user.id) {
      <li><app-user-component [avatar]="user.avatar" [name]="user.name" [id]="user.id"/></li>
    }
  -->
    <li *ngFor="let user of users | slice: 0 : 10">
      <app-user-component
        [user]="user"
        (userSelected)="onSelectUser($event)"
      />
    </li>
  </ul>
  <app-task-component [username]="user().name"/>
</main>
